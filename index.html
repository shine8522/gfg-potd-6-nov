<html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--paper:#f7f3e6;--ink:#1f2a44;--line:#d9d2bd;--L:#1d6fd8;--R:#c2338a;--G:#15803d;--P:#6d28d9;--X:#c62828;--code:#14161f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

background-image:repeating-linear-gradient(transparent 0 31px,#e6dfc9 31px 32px);overflow-x:hidden}

.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-start}

</style></head><body>
<div id="app">
<header><h1>Counting balanced binary trees of height H</h1><span id="cnt"></span><div id="bar"><i></i></div></header>
<main><section id="left" aria-live="polite"><div id="chap"></div><h2 id="title"></h2><div id="stage"></div></section>
<aside id="right"><div id="narr"></div><pre id="code" hidden></pre></aside></main>
<nav><button id="prev">Previous</button><button id="play" class="p">Play</button><button id="next">Next</button><button id="rst">Restart</button>
<label>Speed <select id="spd"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select></label>
<span class="sp"></span><label>Jump to <select id="jump" aria-label="Jump to chapter"></select></label></nav></div>
<script>
/* ===== Helpers: colours, SVG snippets ===== */
const COL={L:'#1d6fd8',R:'#c2338a',T:'#1f2a44',G:'#15803d',X:'#c62828',P:'#6d28d9'};
const sv=(w,h,c)=>`<svg viewBox="0 0 ${w} ${h}" class="sv" style="max-width:${w*1.6}px">${c}</svg>`;
const ln=(a,b,c,d,col=COL.T,dash='')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="2.2" ${dash?'stroke-dasharray="4 3"':''}/>`;
const nd=(x,y,col=COL.T,t='')=>`<circle cx="${x}" cy="${y}" r="11" fill="#fffdf6" stroke="${col}" stroke-width="2.5"/>`+(t!==''?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${col}">${t}</text>`:'');
const tri=(x,y,w,h,lab,col,d=0)=>`<g class="in" style="--d:${d}s"><polygon points="${x},${y} ${x-w/2},${y+h} ${x+w/2},${y+h}" fill="${col}22" stroke="${col}" stroke-width="2"/><text x="${x}" y="${y+h-7}" text-anchor="middle" fill="${col}" class="hw">${lab}</text></g>`;
/* A "case" picture: root + two subtrees drawn as triangles whose size follows their height */
const tH=h=>14+h*17;
function cs(l,r,note,ok=true,d=0){const col=ok?COL.T:COL.X;
 return `<div class="card in" style="--d:${d}s">`+sv(210,150,ln(105,18,55,40,col)+ln(105,18,155,40,col)+nd(105,16,col)+tri(55,40,64,tH(l),'h='+l,COL.L)+tri(155,40,64,tH(r),'h='+r,COL.R))+`<div class="hw" style="color:${col}">(${l}, ${r}) ${note}</div></div>`}
/* Real tiny tree. t={l,r}; leaf={} ; empty child shown as dashed box */
function dT(t,x,y,dx,showE){let s='';const k=(c,nx)=>{if(c){s+=ln(x,y,nx,y+38)+dT(c,nx,y+38,dx/2,showE)}else if(showE){s+=ln(x,y,nx,y+38,COL.X,1)+`<rect x="${nx-8}" y="${y+30}" width="16" height="16" fill="none" stroke="${COL.X}" stroke-dasharray="3 2"/>`}};
 k(t.l,x-dx);k(t.r,x+dx);return s+nd(x,y,COL.T)}
const hgt=t=>t?1+Math.max(hgt(t.l),hgt(t.r)):0;
const bal=t=>!t||(bal(t.l)&&bal(t.r)&&Math.abs(hgt(t.l)-hgt(t.r))<=1);
let seed=7;const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
const gen=d=>d>=3||(d>0&&rnd()<.3)?null:{l:gen(d+1),r:gen(d+1)};
/* reveal button for "think first" moments */
const rv=(q,a)=>`<div class="card" style="margin:8px auto;max-width:460px"><div class="big">${q}</div><button onclick="this.nextElementSibling.hidden=false;this.hidden=true">Reveal answer</button><div hidden class="in big G">${a}</div></div>`;

/* ===== Code listings (exactly as in the lesson) ===== */
const REC=`class Solution {
public:
    const long long MOD = 1000000007;

    int countBT(int h) {

        // Base case: empty tree or single-node tree
        if (h == 0 || h == 1)
            return 1;

        // Both subtrees have height h-1
        long long both =
            (1LL * countBT(h - 1) * countBT(h - 1)) % MOD;

        // One subtree has height h-1,
        // the other has height h-2
        long long different =
            (2LL * countBT(h - 1) * countBT(h - 2)) % MOD;

        return (both + different) % MOD;
    }
};`.split('\n');
const MEM=`class Solution {
public:
    const long long MOD = 1000000007;
    vector<long long> memo;

    long long solve(int h) {

        // Base cases
        if (h == 0 || h == 1)
            return 1;

        // Reuse previously calculated answer
        if (memo[h] != -1)
            return memo[h];

        long long a = solve(h - 1);
        long long b = solve(h - 2);

        long long both = (a * a) % MOD;

        long long different =
            (2LL * a % MOD * b) % MOD;

        return memo[h] = (both + different) % MOD;
    }

    int countBT(int h) {
        memo.assign(h + 1, -1);
        return solve(h);
    }
};`.split('\n');
const CODES={REC,MEM};

/* ===== Traces generated by actually running the code ===== */
// Plain recursion: every call is recorded in the order the C++ evaluates it (left to right).
function recTrace(H){const ev=[];const f=(n,d)=>{ev.push({k:'call',h:n,d});let r,x='base case';
 if(n<2)r=1;else{const a=f(n-1,d+1),b=f(n-1,d+1),c=f(n-1,d+1),e=f(n-2,d+1);r=a*b+2*c*e;x=`${a}x${b} + 2x${c}x${e} = ${r}`}
 ev.push({k:'ret',h:n,d,r,x});return r};f(H,0);return ev}
// Memoization: base case -> memo check -> children -> store
function memTrace(H){const m=Array(H+1).fill(-1),ev=[];const s=(n,d)=>{
 if(n<2){ev.push({k:'base',h:n,d,m:m.slice(),r:1});return 1}
 if(m[n]!=-1){ev.push({k:'hit',h:n,d,m:m.slice(),r:m[n]});return m[n]}
 ev.push({k:'miss',h:n,d,m:m.slice()});const a=s(n-1,d+1),b=s(n-2,d+1),r=a*a+2*a*b;m[n]=r;
 ev.push({k:'store',h:n,d,m:m.slice(),a,b,r});return r};s(H,0);return ev}
const RE=recTrace(4),ME=memTrace(4);

function recView(i){const L=[],st=[],tl={};let act=-1;
 for(let j=0;j<=i;j++){const e=RE[j];if(e.k=='call'){L.push({h:e.h,d:e.d,r:null});st.push(L.length-1);tl[e.h]=(tl[e.h]||0)+1;act=L.length-1}else{const q=st.pop();L[q].r=e.r;act=q}}
 const cur=RE[i];
 return `<div class="tr">${L.map((l,q)=>`<div class="cl ${q==act?(cur.k=='call'?'a':'r'):(l.r!=null&&l.h<2?'b':'')}" style="margin-left:${l.d*16}px" ${q==act?'id="act"':''}>countBT(${l.h})${l.r!=null?' = '+l.r:' ...'}</div>`).join('')}</div>`+tally(tl)}
function tally(tl){return `<div style="margin-top:8px">Calls so far: ${[4,3,2,1,0].map(h=>`<span class="chip ${tl[h]>1?'rep':''}">h=${h} x${tl[h]||0}</span>`).join('')}</div>`}
function memView(i){const L=[],st=[];let act=-1;const e=ME[i];
 for(let j=0;j<=i;j++){const v=ME[j];if(v.k=='miss'){L.push({h:v.h,d:v.d,r:null,k:'miss'});st.push(L.length-1);act=L.length-1}
  else if(v.k=='store'){const q=st.pop();L[q].r=v.r;act=q}else{L.push({h:v.h,d:v.d,r:v.r,k:v.k});act=L.length-1}}
 const nm=(l)=>`solve(${l.h})`;
 return `<table><tr><th>h</th>${e.m.map((_,h)=>`<th>${h}</th>`).join('')}</tr><tr><th>memo</th>${e.m.map((v,h)=>`<td class="${h==e.h?'cur':v!=-1?'set':''}">${v}</td>`).join('')}</tr></table>
 <div class="tr">${L.map((l,q)=>`<div class="cl ${q==act?(l.k=='hit'?'hit':l.k=='store'||l.r!=null?'r':'a'):''}" style="margin-left:${l.d*16}px" ${q==act?'id="act"':''}>${nm(l)}${l.k=='hit'?' MEMO HIT -> '+l.r:l.k=='base'?' base -> 1':l.r!=null?' = '+l.r:' ...'}</div>`).join('')}</div>`}

/* ===== Quiz (answer order rotated per question so the right answer is not always first) ===== */
const Q=[
 ['If the overall height is 6, which subtree-height pairs are possible?',['(5,5), (5,4), (4,5)','(5,5), (4,4)','(6,5), (5,6), (5,5)','(5,5), (5,3), (3,5)'],'The root adds 1, so one subtree must be 5. The other is 5 or 4 (balance). (4,4) only gives height 5; (5,3) breaks balance.'],
 ['Why do we multiply the left and right counts?',['Every left choice can pair with every right choice, independently','Because heights multiply','It makes the code faster','Left trees are always larger'],'Choosing the left tree does not restrict the right one, so the pairs form a grid: rows x columns.'],
 ['Why do we add the three cases?',['They never overlap and together cover every valid tree','Addition is cheaper than multiplication','The cases overlap, so we add to be safe','Each case has the same count'],'Each valid tree has exactly one (left height, right height) pair, so it is counted in exactly one case.'],
 ['What happens if left height is H-1 and right height is H-3?',['Invalid: the difference is 2, so balance breaks','Valid: overall height is still H','Valid but counted twice','Invalid: overall height becomes H-1'],'|(H-1)-(H-3)| = 2 > 1, so some node is unbalanced. The root itself fails the balance rule.'],
 ['What does memo[h] store?',['The number of balanced trees of height exactly h, or -1 if not computed yet','The number of nodes in a tree of height h','The recursion depth at h','The height of the tallest tree'],'It is the cached dp[h]. The value -1 is the "not computed" marker.'],
 ['Why do we fill memo with -1?',['-1 can never be a real count, so it safely means "not computed yet"','Because counts are negative','To trigger the base case','The compiler requires it'],'Real answers are never negative, so -1 cannot be confused with a stored answer.'],
 ['Why does plain recursion repeat work?',['The same height is reached from many branches and nothing remembers earlier answers','Because of the modulo','Because h is global','Recursion always repeats'],'countBT(3) and countBT(2) are called from several parents, and each call recomputes from scratch.'],
 ['What is the time complexity with memoization?',['O(H)','O(2^H)','O(H^2)','O(1)'],'Each height from 2 to H is computed once, with constant work, so the total is O(H).']
];
const QI={};
function quiz(k){const [q,o,why]=Q[k],rot=k%4,opts=o.map((t,i)=>[t,i]);const r=opts.slice(rot).concat(opts.slice(0,rot));
 return `<div class="card" style="text-align:left;max-width:520px;margin:auto"><b class="P">Pause and think</b><div class="big" style="font-size:20px">${q}</div>`+
 r.map(([t,i])=>`<button class="opt" onclick="ans(this,${i},${k})">${t}</button>`).join('')+`<div class="fb" hidden></div></div>`}
function ans(b,i,k){const fb=b.parentNode.querySelector('.fb');fb.hidden=false;
 if(i==0){b.classList.add('ok');fb.innerHTML='<b class="G">Yes.</b> '+Q[k][2]}else{b.classList.add('no');fb.innerHTML='<b>Not quite, and that is a very common guess.</b> '+Q[k][2]}}

/* ===== Lesson script: each step = {c chapter, t title, n narration, d stage html, code?, hl?} ===== */
const S=[];const add=(c,t,n,d,o={})=>S.push({c,t,n,d,...o});
const eqs=(a,dl=.3)=>a.map((x,i)=>`<div class="eq in" style="--d:${i*dl}s">${x}</div>`).join('');

// Chapter 1
let C1='1. Understand the problem';
add(C1,'The question','We are given <b>H</b>. Count the structurally different <b>balanced</b> binary trees with height exactly H, modulo 10^9+7. Empty tree has height 0, a single node has height 1. Balanced means: at every node, the left and right subtree heights differ by at most 1. Left and right matter, so mirror images count as different trees.',
 ()=>`<div class="card big in">Count balanced binary trees of height <b>H</b></div><div class="row" style="margin-top:12px">`+[{}, {l:{}},{l:{},r:{}}].map((t,i)=>`<div class="card in" style="--d:${.3+i*.3}s">`+sv(120,100,dT(t,60,20,26,i==1))+`<div class="hw">height ${hgt(t)}</div></div>`).join('')+`</div>`);
add(C1,'Idea 1: generate and check','Suppose someone says: generate every binary tree, check height, check balance, count. Watch what happens.',
 ()=>{seed=11;let h='<div class="row">';for(let i=0;i<12;i++){const t=gen(0)||{};const b=bal(t);h+=`<div class="card in" style="--d:${i*.35}s;padding:4px">`+sv(110,110,dT(t,55,16,26))+`<div class="hw" style="color:${b?COL.G:COL.X}">h=${hgt(t)} ${b?'balanced':'NOT balanced'}</div></div>`}
 return h+`</div><div class="card in big X" style="--d:4.5s;margin-top:10px">...and the number of trees explodes as H grows</div>`},{slow:1});
add(C1,'Can we count without generating?','Checking trees one by one is hopeless for large H. So the real question is: <b>can we count the trees without ever building them?</b> We will not reveal the trick. We will discover it.',
 ()=>`<div class="card big in" style="max-width:420px;margin:30px auto">Can we count the trees<br>without generating them?</div>`);
add(C1,'The balance condition','<b>|height(left) - height(right)| <= 1</b>. Left 3 and right 2 differ by 1, so fine. Left 3 and right 1 differ by 2, so the tree is unbalanced.',
 ()=>`<div class="row">${cs(3,2,'balanced',true)}${cs(3,1,'unbalanced',false,.4)}</div>`);
add(C1,'Height of a tree','<b>height(root) = 1 + max(height(left), height(right))</b>. The root is a level of its own, so it adds one on top of the taller child. This single formula drives everything next.',
 ()=>`<div class="card eq big in">height(root) = <span class="P">1</span> + max(<span class="L">height(left)</span>, <span class="R">height(right)</span>)</div><div class="row">${cs(3,2,'-> 1 + 3 = 4',true,.4)}</div>`);

// Chapter 2
let C2='2. Discover the three possibilities';
add(C2,'Start with H = 4','Take overall height 4. Think first: what is the tallest either subtree can be? Remember the root adds one level.',
 ()=>sv(210,120,ln(105,18,55,50)+ln(105,18,155,50)+nd(105,16)+`<text x="105" y="-2" font-size="1"></text>`+tri(55,50,64,50,'?',COL.L)+tri(155,50,64,50,'?',COL.R))+rv('Max subtree height?','3, since 1 + 3 = 4'));
add(C2,'Case 1, Case 2, Case 3','At least one subtree must reach height 3, otherwise the root would not reach 4. The other may be 3 or 2 (one less, still balanced). That gives three ordered cases: <b>(3,3)</b>, <b>(3,2)</b>, <b>(2,3)</b>.',
 ()=>`<div class="row">${cs(3,3,'Case 1',true,0)}${cs(3,2,'Case 2',true,.5)}${cs(2,3,'Case 3',true,1)}</div>`);
add(C2,'Why not (3,1) or (2,2)?','<b>(3,1)</b>: difference is 2, violates balance. <b>(2,2)</b>: balanced, but the tallest subtree is 2, so the root gives height 1 + 2 = 3, not 4. Neither is a valid way to build height 4.',
 ()=>`<div class="row">${cs(3,1,'diff = 2, unbalanced',false)}${cs(2,2,'gives height 3, not 4',false,.5)}</div>`);
add(C2,'Generalize to any H','For height H the only possibilities are <b>(H-1, H-1)</b>, <b>(H-1, H-2)</b> and <b>(H-2, H-1)</b>. One side must be H-1; the other can differ by at most one. Left/right order is preserved, so (H-1,H-2) and (H-2,H-1) are different cases.',
 ()=>`<div class="row">${cs('H-1'.length&&3,3,'(H-1, H-1)').replace(/h=3/g,'H-1')}${cs(3,2,'(H-1, H-2)').replace(/h=3/,'H-1').replace(/h=2/,'H-2')}${cs(2,3,'(H-2, H-1)').replace(/h=2/,'H-2').replace(/h=3/,'H-1')}</div>`);
add(C2,'Check yourself','Try the first two checks.',()=>quiz(0)+'<br>'+quiz(3));

// Chapter 3
let C3='3. Why multiplication?';
add(C3,'Pairing left with right','Imagine, hypothetically, there are 20 balanced trees of height 3 and 5 of height 2. For case (3,3): pick any one of 20 left trees. It can sit beside <i>any</i> of the 20 right trees. A 4x4 miniature grid shows the idea; the real grid is 20x20. Har left subtree ke saath right ke saare possible subtrees combine kar sakte hain.',
 ()=>{let h=`<table><tr><th></th>${[1,2,3,4].map(i=>`<th class="L">L${i}</th>`).join('')}</tr>`;for(let r=1;r<=4;r++){h+=`<tr><th class="R">R${r}</th>`+[1,2,3,4].map(c=>`<td class="in" style="--d:${(r*4+c)*.07}s;${r==3&&c==2?'background:#fef9c3':''}">${c}+${r}</td>`).join('')+'</tr>'}
 return h+`</table><div class="card in big" style="--d:1.6s">4 x 4 = 16 pairs here. Real case: <b>20 x 20 = 400</b></div>`});
add(C3,'Three cases, counted separately','(3,3): 20 x 20 = 400. (3,2): 20 x 5 = 100. (2,3): 5 x 20 = 100. We <b>multiply</b> because left and right are chosen independently: every valid left choice pairs with every valid right choice.',
 ()=>`<div class="row"><div class="card in big">(3,3)<br>20 x 20 = <b>400</b></div><div class="card in big" style="--d:.5s">(3,2)<br>20 x 5 = <b>100</b></div><div class="card in big" style="--d:1s">(2,3)<br>5 x 20 = <b>100</b></div></div>`);
add(C3,'Why add the cases?','The three cases are mutually exclusive: a tree has one definite pair of subtree heights. Every valid tree falls in exactly one case, so we count each case and <b>add</b>: 400 + 100 + 100 = 600. (These 20 and 5 are made-up numbers for practice. The real values come soon.)',
 ()=>eqs(['<span class="P">400</span> + <span class="P">100</span> + <span class="P">100</span>','= <b class="G">600</b>'],.8)+`<div class="card" style="margin-top:8px">multiply inside a case (independent choices)<br>add across cases (exclusive and exhaustive)</div>`);
add(C3,'Check yourself','',()=>quiz(1)+'<br>'+quiz(2));

// Chapter 4
let C4='4. Where does DP come from?';
add(C4,'Where do those answers come from?','To count height 4 we needed answers for heights 3 and 2. But where do those come from? Height 3 needs heights 2 and 1. Height 2 needs heights 1 and 0. The same question keeps shrinking.',
 ()=>{const P={4:[200,20],3:[110,80],'2b':[290,80],'2a':[50,140],'1a':[170,140],'1b':[250,140],'0b':[330,140],'1c':[20,200],'0a':[80,200]};
 const e=[['4','3'],['4','2b'],['3','2a'],['3','1a'],['2b','1b'],['2b','0b'],['2a','1c'],['2a','0a']];
 return sv(360,225,e.map(([a,b])=>ln(P[a][0],P[a][1],P[b][0],P[b][1])).join('')+Object.entries(P).map(([k,[x,y]])=>nd(x,y,'2b,2a,1a,1b,1c'.includes(k)?COL.X:COL.T,k[0])).join(''))+`<div class="hw" style="text-align:center">Dependencies: 4 needs 3 and 2; 3 needs 2 and 1; 2 needs 1 and 0</div>`});
add(C4,'Same work, again and again','Look at the red circles: height 2 appears twice, height 1 appears three times. Why calculate the same answer again and again? Compute it once, store it, reuse it. That single thought is dynamic programming.',
 ()=>`<div class="card big in">Same subproblem, same answer.<br><b class="G">Store once, reuse.</b></div>`);
add(C4,'Define dp[h]','<b>dp[h]</b> = the <b>number</b> of <b>structurally distinct</b> <b>balanced binary trees</b> of height <b>exactly h</b>. Number: we count, we do not list. Structurally distinct: shape matters, labels do not. Balanced: every node obeys the rule. Exactly h: not at most h.',
 ()=>`<div class="card eq big in"><span class="P">dp[h]</span> = # structurally distinct balanced trees of height exactly h</div>`);

// Chapter 5
let C5='5. Why are the base cases 1?';
add(C5,'Where does it stop?','The shrinking must stop somewhere. Height 1: a single node, exactly one tree. Height 0: the empty tree, exactly one (very small) structure.',
 ()=>`<div class="row"><div class="card in">`+sv(100,60,nd(50,30))+`<div class="hw">dp[1] = 1</div></div><div class="card in" style="--d:.5s">`+sv(100,60,`<rect x="40" y="18" width="20" height="20" fill="none" stroke="${COL.X}" stroke-dasharray="3 2"/>`)+`<div class="hw">dp[0] = 1</div></div></div>`);
add(C5,'But the empty tree has no nodes!','Why should it contribute 1 and not 0? Choose.',
 ()=>`<div class="card" style="max-width:520px;margin:auto"><button class="opt" onclick="this.classList.add('ok');this.parentNode.querySelector('.fb').hidden=false">A. It has one valid structure: the empty tree</button><button class="opt" onclick="this.classList.add('no');this.parentNode.querySelector('.fb').hidden=false">B. Because we are counting nodes</button><div class="fb" hidden><b class="G">A is right.</b> The problem counts <b>structures</b>, not nodes. "Nothing" is exactly one way to have an empty child.</div></div>`);
add(C5,'Height 2, with real trees','Height 2 can be built as (1,1), (1,0), (0,1). That is 3 real trees. With dp[0] = 1: 1x1 + 1x1 + 1x1 = 3.',
 ()=>`<div class="row">`+[{l:{},r:{}},{l:{}},{r:{}}].map((t,i)=>`<div class="card in" style="--d:${i*.5}s">`+sv(120,100,dT(t,60,20,26,true))+`<div class="hw">(${t.l?1:0},${t.r?1:0})</div></div>`).join('')+`</div><div class="eq" style="text-align:center">dp[2] = 1 + 1 + 1 = <b class="G">3</b></div>`);
add(C5,'What if dp[0] were 0?','Then (1,0) gives 1x0 = 0 and (0,1) gives 0x1 = 0. Two valid trees vanish and we would get 1 instead of 3. So dp[0] = 1 is mathematically necessary, not a trick.',
 ()=>eqs(['<span class="X">dp[0] = 0:</span> 1x1 + 1x0 + 0x1 = <b class="X">1</b> (wrong)','<span class="G">dp[0] = 1:</span> 1x1 + 1x1 + 1x1 = <b class="G">3</b> (right)']));

// Chapter 6
let C6='6. Derive the recurrence';
const RC=['<span class="L">dp[H-1]</span> x <span class="R">dp[H-1]</span>','<span class="L">dp[H-1]</span> x <span class="R">dp[H-2]</span>','<span class="L">dp[H-2]</span> x <span class="R">dp[H-1]</span>'];
add(C6,'Piece 1','Case (H-1, H-1): dp[H-1] choices on the left times dp[H-1] on the right.',()=>eqs(['Case 1 = '+RC[0]]));
add(C6,'Piece 2','Case (H-1, H-2): dp[H-1] on the left times dp[H-2] on the right.',()=>eqs(['Case 1 = '+RC[0],'Case 2 = '+RC[1]],.1));
add(C6,'Piece 3','Case (H-2, H-1): the mirror case. Order matters, so it is a separate case.',()=>eqs(['Case 1 = '+RC[0],'Case 2 = '+RC[1],'Case 3 = '+RC[2]],.1));
add(C6,'Add them up, then simplify','dp[H] = Case 1 + Case 2 + Case 3. Cases 2 and 3 are the same product, so they combine: <b>dp[H] = dp[H-1]^2 + 2 x dp[H-1] x dp[H-2]</b>.',
 ()=>eqs(['dp[H] = '+RC[0]+' + '+RC[1]+' + '+RC[2],'dp[H] = dp[H-1]^2 + <span class="P">2</span> x dp[H-1] x dp[H-2]'],.9)+eqs(['dp[3] = 3x3 + 2x3x1 = 15','dp[4] = 15x15 + 2x15x3 = 315'],.4));

// Chapter 7 (code, recursive)
let C7='7. Plain recursive code';
const rc=(t,n,hl)=>add(C7,t,n,()=>`<div class="card in">${t}</div>`,{code:'REC',hl});
rc('Educational first version','This is the <span class="tag">plain recursion</span>: great for understanding, <b>exponentially slow</b>. It is not the final efficient solution. Read it line by line next.',[]);
rc('Signature','It returns <b>int</b> because the answer is already reduced mod 10^9+7, which fits in int. The only input is <b>h</b>: the answer depends on nothing else.',[4]);
rc('Base case','Heights 0 and 1 have exactly one tree each, so return 1. Without a base case the recursion would never stop.',[5,6]);
rc('Both subtrees h-1','Two recursive calls because the left and the right each need a count. We multiply (independent choices). <b>1LL</b> promotes to 64-bit so the product of two numbers near 10^9 (about 10^18) does not overflow int. Apply % MOD right after the multiplication.',[9,10]);
rc('One h-1, one h-2','Two orders, (h-1,h-2) and (h-2,h-1), have the same count, so we multiply by <b>2</b>. <b>2LL</b> keeps the arithmetic in 64-bit, then % MOD.',[13,14]);
rc('Combine','Add the two cases and apply % MOD again, because the sum of two residues can exceed MOD.',[16]);

// Chapter 8 dry run
let C8='8. Recursive dry run (H = 4)';
add(C8,'The calculation on paper','countBT(4) = countBT(3)xcountBT(3) + 2xcountBT(3)xcountBT(2). With countBT(3) = 15 and countBT(2) = 3: 15x15 + 2x15x3 = 225 + 90 = <b>315</b>. But where do 15 and 3 come from? Conceptually the tree is 4 -> (3 -> (2, 1)), 2. The real code makes more calls than this, so we will trace the real execution.',
 ()=>eqs(['countBT(4) = countBT(3)xcountBT(3) + 2xcountBT(3)xcountBT(2)','= 15x15 + 2x15x3','= 225 + 90 = <b class="G">315</b>']),{code:'REC',hl:[9,10,13,14]});
RE.forEach((e,i)=>add(C8,`Execution event ${i+1} of ${RE.length}`,
 e.k=='call'?(e.h<2?`Call <b>countBT(${e.h})</b>. h is ${e.h}: base case, it will return 1.`:`Call <b>countBT(${e.h})</b>. It will call countBT(${e.h-1}) twice (the "both" line, left to right), then countBT(${e.h-1}) and countBT(${e.h-2}) again for the "different" line.`)+(RE.slice(0,i).filter(x=>x.k=='call'&&x.h==e.h).length?` <b class="X">Seen before: this exact height is being recomputed.</b>`:''):
 `<b>countBT(${e.h})</b> returns <b class="G">${e.r}</b>${e.h>=2?` (${e.x})`:''}, travelling back up to its caller.`,
 ()=>recView(i),{fast:1,code:'REC',hl:e.k=='call'?(e.h<2?[5,6]:[9,10,13,14]):(e.h<2?[6]:[16])}));
add(C8,'We repeated ourselves','Total calls: '+RE.filter(e=>e.k=='call').length+'. Heights recomputed again and again: countBT(3) is called 3 times and countBT(2) '+RE.filter(e=>e.k=='call'&&e.h==2).length+' times, each from scratch. We are calculating the same answer multiple times! Each call spawns four more, so the work grows exponentially in H, not as O(H).',
 ()=>recView(RE.length-1),{code:'REC',hl:[]});
add(C8,'Check yourself','',()=>quiz(6));

// Chapter 9-10 memo
let C9='9. Why memoization?';
add(C9,'Remember answers','If countBT(3) is already calculated, why calculate it again? Keep a <b>memo</b> array: memo[h] stores the answer for height h. It starts as [-1, -1, -1, -1, -1] where -1 means "not calculated yet". Procedure: check memo[h]; if -1, compute smaller heights, store the result; next time return it instantly.',
 ()=>`<table><tr><th>h</th>${[0,1,2,3,4].map(h=>`<th>${h}</th>`).join('')}</tr><tr><th>memo</th>${[0,1,2,3,4].map(()=>'<td>-1</td>').join('')}</tr></table><div class="card in big" style="margin-top:8px">hit = return stored value, skip the whole recursive branch</div>`);
add(C9,'Check yourself','',()=>quiz(4)+'<br>'+quiz(5));
let C10='10. Memoized code';
const mc=(t,n,hl)=>add(C10,t,n,()=>`<div class="card in">${t}</div>`,{code:'MEM',hl});
mc('Same recurrence, plus a notebook','Same logic as before, but answers are stored. Next, each line.',[]);
mc('Setup','<b>memo</b> is a member so solve() and countBT() share it. <b>assign(h+1, -1)</b> makes indices 0..h valid, all marked not computed. countBT calls solve(h) to start.',[3,26,27,28]);
mc('Base cases first','Check h == 0 or 1 before looking at memo. memo[0] and memo[1] are never filled (the array may even be too small for index 1 when h = 0), so the base case must come first.',[7,8,9]);
mc('Reuse','If memo[h] is not -1 we already know the answer, so return it immediately. This is what skips repeated branches.',[11,12,13]);
mc('Each child once','solve(h-1) and solve(h-2) are called once each and stored in a and b, instead of calling them several times like before.',[15,16]);
mc('Combine and store','both = a*a mod MOD. different = 2*a mod MOD, then times b, then mod. Finally memo[h] = result stores it and returns it. In plain words: recursion forgets everything; memoization writes answers down.',[18,20,21,23]);
let C11='11. Memoized dry run (H = 4)';
const mn={miss:e=>`Call <b>solve(${e.h})</b>. Not a base case, memo[${e.h}] = -1, so it must compute solve(${e.h-1}) and solve(${e.h-2}).`,
 base:e=>`<b>solve(${e.h})</b> is a base case: returns 1 immediately (memo not touched).`,
 hit:e=>`<b>solve(${e.h})</b> again. memo[${e.h}] = <b class="G">${e.r}</b>, not -1: <b>MEMO HIT</b>. Return ${e.r} immediately, no recomputation.`,
 store:e=>`Both children are back: a = ${e.a}, b = ${e.b}. solve(${e.h}) = ${e.a}x${e.a} + 2x${e.a}x${e.b} = <b class="G">${e.r}</b>. Store memo[${e.h}] = ${e.r}.`};
ME.forEach((e,i)=>add(C11,`Memo event ${i+1} of ${ME.length}`,mn[e.k](e),()=>memView(i),{fast:1,code:'MEM',hl:{miss:[11,12],base:[8,9],hit:[12,13],store:[15,16,18,20,21,23]}[e.k]}));
add(C11,'Final table','Each height from 2 to 4 was computed once. The answers: dp[0]=1, dp[1]=1 (base cases), dp[2]=3, dp[3]=15, dp[4]=315. Note: the memo array itself keeps -1 at 0 and 1 because base cases return before touching it.',
 ()=>`<table><tr><th>Height</th><th>Answer</th></tr>`+[1,1,3,15,315].map((v,h)=>`<tr><td>${h}</td><td class="set">${v}</td></tr>`).join('')+'</table>');
let C12='12. Complexity';
add(C12,'Recursion vs memoization','<b>Plain recursion:</b> recomputes subproblems, time is exponential in H (each call spawns four more), stack depth O(H). <b>Memoization:</b> each height computed once, so time O(H); space is O(H) for the memo array plus O(H) recursion stack, so auxiliary space is O(H).',
 ()=>`<table><tr><th></th><th>Time</th><th>Space</th></tr><tr><td>Plain</td><td class="X">exponential</td><td>O(H) stack</td></tr><tr><td>Memo</td><td class="G">O(H)</td><td>O(H) memo + O(H) stack = O(H)</td></tr></table>`);
add(C12,'Final check','',()=>quiz(7));
add(C12,'You can now explain it','Only three subtree-height pairs exist; we multiply inside a case and add across cases; dp[0]=1 because the empty tree is one structure; the recurrence is just those pieces added; plain recursion repeats; memo writes answers down. Press Restart to replay.',
 ()=>`<div class="card big in">dp[H] = dp[H-1]^2 + 2 x dp[H-1] x dp[H-2]<br>dp[0] = dp[1] = 1</div>`);

/* ===== Player engine ===== */
let i=0,timer=null;const $=s=>document.querySelector(s);
const chaps=[...new Set(S.map(s=>s.c))];
$('#jump').innerHTML=chaps.map(c=>`<option value="${c}">${c}</option>`).join('');
function show(n){i=Math.max(0,Math.min(S.length-1,n));const s=S[i];
 $('#chap').textContent=s.c;$('#title').textContent=s.t;$('#stage').innerHTML=s.d();$('#narr').innerHTML=s.n||'Answer the questions above, then press Next.';
 $('#cnt').textContent=`Step ${i+1} / ${S.length}`;$('#bar i').style.width=((i+1)/S.length*100)+'%';$('#jump').value=s.c;
 const pre=$('#code');if(s.code){pre.hidden=false;pre.innerHTML=CODES[s.code].map((l,k)=>`<span class="${(s.hl||[]).includes(k)?'h':''}">${l.replace(/&/g,'&amp;').replace(/</g,'&lt;')||' '}</span>`).join('')}else pre.hidden=true;
 const a=$('#act');if(a)a.scrollIntoView({block:'nearest'});
 if(timer&&s.d().includes('class="opt"'))stop();}
function stop(){clearTimeout(timer);timer=null;$('#play').textContent='Play'}
function tick(){const s=S[i];if(i>=S.length-1){stop();return}
 const sp=+$('#spd').value;const ms=s.fast?1400:Math.max(3500,(s.n||'').length*42)+(s.slow?3500:0);
 timer=setTimeout(()=>{show(i+1);if(timer){if(S[i].d().includes('class="opt"')){stop()}else tick()}},ms/sp)}
$('#play').onclick=()=>{if(timer){stop()}else{if(i>=S.length-1)show(0);$('#play').textContent='Pause';tick()}};
$('#next').onclick=()=>{stop();show(i+1)};$('#prev').onclick=()=>{stop();show(i-1)};$('#rst').onclick=()=>{stop();show(0)};
$('#jump').onchange=e=>{stop();show(S.findIndex(s=>s.c==e.target.value))};
$('#spd').onchange=()=>{if(timer){clearTimeout(timer);tick()}};
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')$('#next').click();if(e.key=='ArrowLeft')$('#prev').click()});
show(0);
</script></body></html>
